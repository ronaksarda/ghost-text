<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghost Text Shield</title>
<style>
  :root { --void: #030101; --crypt: #0c0607; --rot: #2a1113; --bone: #ece4d6; --ash: #9a8f84; --blood: #e0142f; --clean: #9ee27a; --uneasy: #e9b13c; }
  body { margin: 0; width: 340px; background: var(--void); color: var(--bone); font: 14px/1.5 system-ui, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--rot); }
  header img { width: 36px; height: 36px; image-rendering: pixelated; }
  h1 { font: 700 15px/1.2 system-ui, sans-serif; margin: 0; }
  #summary { margin: 2px 0 0; color: var(--ash); font-size: 13px; }
  #summary.bad { color: var(--blood); }
  ol { list-style: none; margin: 0; padding: 8px 16px; max-height: 300px; overflow: auto; }
  li { padding: 10px 0; border-bottom: 1px solid var(--rot); }
  li:last-child { border: 0; }
  .text { font-family: "Courier New", monospace; overflow-wrap: anywhere; }
  .meta { color: var(--ash); font-size: 12px; margin-top: 4px; }
  .tag { color: var(--blood); font-weight: 700; }
  .tag.suspicious { color: var(--uneasy); }
  .empty { color: var(--ash); padding: 14px 16px; margin: 0; }
  form { padding: 12px 16px; border-top: 1px solid var(--rot); display: grid; gap: 8px; }
  label { display: flex; gap: 8px; align-items: flex-start; }
  label small { display: block; color: var(--ash); }
  footer { padding: 0 16px 14px; font-size: 12px; color: var(--ash); }
  a { color: var(--bone); text-decoration-color: var(--blood); }
</style>
</head>
<body>
<header>
  <img src="icon48.png" alt="">
  <div><h1>Ghost Text Shield</h1><p id="summary" role="status">Checking this page…</p></div>
</header>
<ol id="list"></ol>
<form>
  <label><input type="checkbox" id="enabled"> <span>Remove hidden instructions on every page</span></label>
  <label><input type="checkbox" id="judge"> <span>Ask the AI judge about unclear hidden text<small>Sends only the hidden sentences, never the page, to Ghost Text. Nothing is stored.</small></span></label>
</form>
<footer>Your AI reads the page after the shield has cleaned it. Reload the page after changing a setting.</footer>
<script src="popup.js"></script>
</body>
</html>
